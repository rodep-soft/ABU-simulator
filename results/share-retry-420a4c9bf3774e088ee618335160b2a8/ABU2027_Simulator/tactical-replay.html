<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ABU Robocon 2027 Tactical Replay</title>
    <link rel="stylesheet" href="tactical-replay.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>戦術リプレイ</h1>
          <p>TR/BRの3分間軌跡</p>
          <p><a href="field-simulator.html">新しいフィールド検証アプリ</a></p>
        </div>
        <div class="controls">
          <label>
            ケース
            <select id="case-select">
              <option value="stable-self">E3 -> E1+S2 自力Sanctuary</option>
              <option value="flip-trap">E2 -> E1+S1 共有餌からSky反転</option>
              <option value="poach">相手1段目をE+Sで漁夫完成</option>
            </select>
          </label>
          <label>
            赤速度
            <select id="speed-select">
              <option value="1">同等</option>
              <option value="0.75">3/4</option>
              <option value="0.5">1/2</option>
              <option value="0.25">1/4</option>
            </select>
          </label>
          <label>
            青の反応
            <select id="blue-response-select">
              <option value="ignore">乗ってこない</option>
              <option value="join">共有に乗ってくる</option>
            </select>
          </label>
          <button type="button" id="play-button">再生</button>
        </div>
      </header>

      <section class="status-grid" aria-live="polite">
        <div>
          <span>Time</span>
          <strong id="time-label">0.0s</strong>
        </div>
        <div>
          <span>Red</span>
          <strong id="red-score">0</strong>
        </div>
        <div>
          <span>Blue</span>
          <strong id="blue-score">0</strong>
        </div>
        <div>
          <span>Sanctuary</span>
          <strong id="sanctuary-label">未達</strong>
        </div>
      </section>

      <section class="timeline">
        <input id="time-slider" type="range" min="0" max="180" value="0" step="0.1" aria-label="再生時刻">
      </section>

      <section class="layout">
        <div class="field-wrap">
          <svg id="field" viewBox="0 0 100 100" role="img" aria-label="ABU Robocon 2027 field replay">
            <image href="assets/solidworks-field-top.png" x="0" y="0" width="100" height="100" preserveAspectRatio="none"></image>
            <g id="annotation-layer"></g>
            <g id="trail-layer"></g>
            <g id="tower-layer"></g>
            <g id="robot-layer"></g>
          </svg>
        </div>

        <aside class="side-panel">
          <section class="state-panel">
            <h2>状態</h2>
            <div class="state-section">
              <h3>ロボット積載</h3>
              <div class="state-grid">
                <div><span>赤TR</span><strong id="red-tr-cargo">空</strong></div>
                <div><span>赤BR</span><strong id="red-br-cargo">空</strong></div>
                <div><span>青TR</span><strong id="blue-tr-cargo">空</strong></div>
                <div><span>青BR</span><strong id="blue-br-cargo">空</strong></div>
              </div>
            </div>
            <div class="state-section">
              <h3>Transfer</h3>
              <div class="state-grid">
                <div><span>赤</span><strong id="red-transfer">E0 / S0 / M0</strong></div>
                <div><span>青</span><strong id="blue-transfer">E0 / S0 / M0</strong></div>
              </div>
            </div>
            <div class="state-section">
              <h3>タワー</h3>
              <ul id="tower-state-list" class="tower-state-list"></ul>
            </div>
          </section>

          <section class="event-panel">
            <h2>イベント</h2>
            <ol id="event-list"></ol>
          </section>
        </aside>
      </section>
    </main>

    <script src="tactical-replay.js"></script>
  </body>
</html>
